<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aura Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #111111;
            --text-main: #ffffff;
            --text-secondary: #888888;
            --ton-color: #0088CC;
            --border: #222222;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, system-ui, sans-serif;
            margin: 0;
            padding-bottom: 120px;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        .left-side { display: flex; align-items: center; gap: 12px; }

        .balance {
            font-size: 34px; 
            font-weight: 900;
            letter-spacing: -1.5px;
            display: flex;
            align-items: baseline;
        }

        .balance span {
            font-size: 18px; 
            color: var(--text-secondary);
            font-weight: 700;
            margin-left: 6px;
        }

        .profile-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            width: 42px; height: 42px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; cursor: pointer;
        }

        #ton-connect-button { scale: 0.9; transform-origin: right; }

        /* Блок фильтров */
        .filters-container {
            padding: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .filter-select, .filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: white;
            padding: 12px;
            border-radius: 14px;
            font-size: 13px;
            outline: none;
        }

        .full-width { grid-column: span 2; }

        /* Контентные секции */
        .page-content { display: none; padding: 0 15px; animation: fadeIn 0.3s ease; }
        .page-content.active { display: grid; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .grid-2 { grid-template-columns: 1fr 1fr; gap: 12px; }

        .item-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 12px;
            text-align: center;
            margin-bottom: 5px;
        }

        .item-preview {
            font-size: 45px; margin-bottom: 12px;
            background: linear-gradient(135deg, #1a1a1a, #0a0a0a);
            aspect-ratio: 1/1;
            display: flex; align-items: center; justify-content: center;
            border-radius: 20px;
            border: 1px solid #222;
        }

        .item-name { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
        .item-price { color: var(--ton-color); font-weight: 800; font-size: 15px; }

        .btn-main {
            margin-top: 12px; width: 100%; padding: 10px;
            border-radius: 12px; border: none;
            background: #fff; color: #000;
            font-weight: 800; font-size: 12px;
        }

        nav {
            position: fixed; bottom: 0; width: 100%;
            background: rgba(10,10,10,0.95);
            border-top: 1px solid var(--border);
            display: flex; justify-content: space-around;
            padding: 10px 0 25px 0; backdrop-filter: blur(15px);
            z-index: 1000;
        }

        .nav-item {
            color: var(--text-secondary);
            text-decoration: none; font-size: 10px;
            display: flex; flex-direction: column;
            align-items: center; gap: 4px; width: 25%;
        }
        
        .nav-item.active { color: #fff; }
        .nav-item span:first-child { font-size: 22px; }
    </style>
</head>
<body>

    <header>
        <div class="left-side">
            <div class="balance">1.23<span>TON</span></div>
            <div class="profile-btn" onclick="showPage('profile')">👤</div>
        </div>
        <div class="header-btns">
            <div id="ton-connect-button"></div>
        </div>
    </header>

    <div id="market-filters" class="filters-container">
        <select class="filter-select"><option>Название</option></select>
        <select class="filter-select"><option>Модель</option></select>
        <button class="filter-btn">Каталог фонов</button>
        <button class="filter-btn">Узоры</button>
        <select class="filter-select full-width"><option>Сортировка: недавно добавленные</option></select>
    </div>

    <div id="market-page" class="page-content active grid-2">
        </div>

    <div id="auctions-page" class="page-content grid-2">
        <div class="item-card" style="grid-column: span 2;">
            <p style="color:#888;">Активных аукционов пока нет</p>
        </div>
    </div>
    <div id="gifts-page" class="page-content">
        <p style="text-align:center; padding-top:50px; color:#888;">У вас пока нет подарков</p>
    </div>
    <div id="activity-page" class="page-content">
        <p style="text-align:center; padding-top:50px; color:#888;">История пуста</p>
    </div>
    <div id="profile-page" class="page-content">
        <h2 style="text-align:center;">Профиль</h2>
    </div>

    <nav>
        <a href="javascript:void(0)" class="nav-item active" id="nav-market" onclick="showPage('market')"><span>🏪</span>Market</a>
        <a href="javascript:void(0)" class="nav-item" id="nav-auctions" onclick="showPage('auctions')"><span>🔨</span>Auctions</a>
        <a href="javascript:void(0)" class="nav-item" id="nav-gifts" onclick="showPage('gifts')"><span>🎁</span>My Gifts</a>
        <a href="javascript:void(0)" class="nav-item" id="nav-activity" onclick="showPage('activity')"><span>📊</span>Activity</a>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Данные для ленты
        const inventory = [
            { name: "Aura Crystal", price: 5, icon: "💎" },
            { name: "Aura Box", price: 10, icon: "🎁" },
            { name: "Rare Pattern", price: 15, icon: "✨" },
            { name: "Golden Shell", price: 25, icon: "🐚" },
            { name: "Neon Frame", price: 8, icon: "🖼" },
            { name: "Dark Energy", price: 12, icon: "🌑" },
            { name: "Ether Orb", price: 20, icon: "🔮" },
            { name: "Aura Ticket", price: 3, icon: "🎟" }
        ];

        function renderMarket() {
            const container = document.getElementById('market-page');
            container.innerHTML = inventory.map(item => `
                <div class="item-card">
                    <div class="item-preview">${item.icon}</div>
                    <div class="item-name">${item.name}</div>
                    <div class="item-price">${item.price} TON</div>
                    <button class="btn-main" onclick="buy('${item.name}')">Купить</button>
                </div>
            `).join('');
        }

        function showPage(pageId) {
            document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            // Прячем фильтры, если это не маркет
            document.getElementById('market-filters').style.display = (pageId === 'market') ? 'grid' : 'none';
            
            document.getElementById(pageId + '-page').classList.add('active');
            document.getElementById('nav-' + pageId).classList.add('active');
            tg.HapticFeedback.impactOccurred('light');
        }

        function buy(name) { tg.showConfirm("Купить " + name + "?"); }

        // Запуск
        renderMarket();

        try {
            const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
                manifestUrl: 'https://alexfunnyman.github.io/Aura-Marketplace/tonconnect-manifest.json',
                buttonRootId: 'ton-connect-button'
            });
        } catch (e) {}
    </script>
</body>
</html>
