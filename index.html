<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aura Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #111111;
            --text-main: #ffffff;
            --text-secondary: #888888;
            --ton-color: #0088CC;
            --border: #222222;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, system-ui, sans-serif;
            margin: 0;
            padding-bottom: 100px;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        .left-side { display: flex; align-items: center; gap: 12px; }

        .balance {
            font-size: 34px; 
            font-weight: 900;
            letter-spacing: -1.5px;
            display: flex;
            align-items: baseline;
        }

        .balance span {
            font-size: 18px; 
            color: var(--text-secondary);
            font-weight: 700;
            margin-left: 6px;
        }

        .profile-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            width: 42px; height: 42px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; cursor: pointer;
        }

        #ton-connect-button { scale: 0.9; transform-origin: right; }

        /* Контентные секции */
        .page-content { display: none; padding: 20px 15px; animation: fadeIn 0.3s ease; }
        .page-content.active { display: grid; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .grid-2 { grid-template-columns: 1fr 1fr; gap: 12px; }

        .item-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 16px;
            text-align: center;
        }

        .item-preview {
            font-size: 40px; margin-bottom: 10px;
            background: #1a1a1a; aspect-ratio: 1/1;
            display: flex; align-items: center; justify-content: center;
            border-radius: 16px;
        }

        .btn-main {
            margin-top: 12px; width: 100%; padding: 10px;
            border-radius: 12px; border: none;
            background: #fff; color: #000;
            font-weight: 800; font-size: 13px;
        }

        /* Список Activity */
        .activity-item {
            display: flex; align-items: center; gap: 12px;
            background: var(--card-bg); padding: 12px;
            border-radius: 16px; margin-bottom: 8px;
            border: 1px solid var(--border);
        }

        nav {
            position: fixed; bottom: 0; width: 100%;
            background: rgba(10,10,10,0.95);
            border-top: 1px solid var(--border);
            display: flex; justify-content: space-around;
            padding: 10px 0 25px 0; backdrop-filter: blur(15px);
            z-index: 1000;
        }

        .nav-item {
            color: var(--text-secondary);
            text-decoration: none; font-size: 10px;
            display: flex; flex-direction: column;
            align-items: center; gap: 4px; width: 25%;
        }
        
        .nav-item.active { color: #fff; }
        .nav-item span:first-child { font-size: 22px; }
    </style>
</head>
<body>

    <header>
        <div class="left-side">
            <div class="balance">5000.23<span>TON</span></div>
            <div class="profile-btn" onclick="showPage('profile')">👤</div>
        </div>
        <div class="header-btns">
            <div id="ton-connect-button"></div>
        </div>
    </header>

    <div id="market-page" class="page-content active grid-2">
        <div class="item-card">
            <div class="item-preview">💎</div>
            <div style="font-weight:600">Aura Crystal</div>
            <div style="color:var(--ton-color); font-weight:800">5 TON</div>
            <button class="btn-main" onclick="buy('Crystal')">Купить</button>
        </div>
        <div class="item-card">
            <div class="item-preview">🎁</div>
            <div style="font-weight:600">Aura Box</div>
            <div style="color:var(--ton-color); font-weight:800">10 TON</div>
            <button class="btn-main" onclick="buy('Box')">Купить</button>
        </div>
    </div>

    <div id="auctions-page" class="page-content grid-2">
        <div class="item-card">
            <div class="item-preview">⚡️</div>
            <div style="font-weight:600">Rare Aura</div>
            <div style="color:#ffcc00; font-weight:800">50 TON</div>
            <button class="btn-main" style="background:#ffcc00" onclick="bid()">Ставка</button>
        </div>
    </div>

    <div id="gifts-page" class="page-content">
        <div style="text-align:center; padding: 40px 0;">
            <div style="font-size:50px; opacity:0.3;">🎁</div>
            <h3 style="margin:10px 0 5px 0;">Пока пусто</h3>
            <p style="color:var(--text-secondary); font-size:14px;">Купите свой первый подарок в Маркете</p>
            <button class="btn-main" style="width:auto; padding:10px 30px;" onclick="showPage('market')">В Маркет</button>
        </div>
    </div>

    <div id="activity-page" class="page-content">
        <div class="activity-item">
            <div style="font-size:24px;">✅</div>
            <div>
                <div style="font-weight:600; font-size:14px;">Покупка Aura Box</div>
                <div style="font-size:12px; color:var(--text-secondary);">2 минуты назад</div>
            </div>
        </div>
        <div class="activity-item">
            <div style="font-size:24px;">💰</div>
            <div>
                <div style="font-weight:600; font-size:14px;">Ставка перебита</div>
                <div style="font-size:12px; color:var(--text-secondary);">15 минут назад</div>
            </div>
        </div>
    </div>

    <div id="profile-page" class="page-content" style="text-align:center;">
        <h2>Мой Аккаунт</h2>
        <div class="item-card" style="margin-top:20px;">
            <p>Статус: Новичок</p>
            <p>ID: 48151623</p>
        </div>
    </div>

    <nav>
        <a href="javascript:void(0)" class="nav-item active" id="nav-market" onclick="showPage('market')"><span>🏪</span>Market</a>
        <a href="javascript:void(0)" class="nav-item" id="nav-auctions" onclick="showPage('auctions')"><span>🔨</span>Auctions</a>
        <a href="javascript:void(0)" class="nav-item" id="nav-gifts" onclick="showPage('gifts')"><span>🎁</span>My Gifts</a>
        <a href="javascript:void(0)" class="nav-item" id="nav-activity" onclick="showPage('activity')"><span>📊</span>Activity</a>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function showPage(pageId) {
            document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            document.getElementById(pageId + '-page').classList.add('active');
            const navBtn = document.getElementById('nav-' + pageId);
            if(navBtn) navBtn.classList.add('active');
            
            tg.HapticFeedback.impactOccurred('light');
        }

        function buy(name) { tg.showConfirm("Купить " + name + "?"); }
        function bid() { tg.showAlert("Ставка принята!"); }

        try {
            const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
                manifestUrl: 'https://alexfunnyman.github.io/Aura-Marketplace/tonconnect-manifest.json',
                buttonRootId: 'ton-connect-button'
            });
        } catch (e) {}
    </script>
</body>
</html>
