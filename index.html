<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aura Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #111111;
            --text-main: #ffffff;
            --text-secondary: #888888;
            --ton-color: #0088CC;
            --border: #222222;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, system-ui, sans-serif;
            margin: 0;
            padding-bottom: 100px;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        .left-side { display: flex; align-items: center; gap: 12px; }

        .balance {
            font-size: 34px; 
            font-weight: 900;
            letter-spacing: -1.5px;
            display: flex;
            align-items: baseline;
        }

        .balance span {
            font-size: 18px; 
            color: var(--text-secondary);
            font-weight: 700;
            margin-left: 6px;
        }

        .profile-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            width: 42px; height: 42px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; cursor: pointer;
        }

        #ton-connect-button { scale: 0.9; transform-origin: right; }

        /* Контентные секции */
        .page-content { display: none; padding: 20px 15px; }
        .page-content.active { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .item-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 16px;
            text-align: center;
        }

        .item-preview {
            font-size: 40px; margin-bottom: 10px;
            background: #1a1a1a; aspect-ratio: 1/1;
            display: flex; align-items: center; justify-content: center;
            border-radius: 16px;
        }

        .btn-main {
            margin-top: 12px; width: 100%; padding: 10px;
            border-radius: 12px; border: none;
            background: #fff; color: #000;
            font-weight: 800; font-size: 13px;
        }

        .badge-auction {
            background: #ff3b30; color: white;
            font-size: 10px; padding: 2px 8px;
            border-radius: 10px; margin-bottom: 5px;
            display: inline-block;
        }

        nav {
            position: fixed; bottom: 0; width: 100%;
            background: rgba(10,10,10,0.9);
            border-top: 1px solid var(--border);
            display: flex; justify-content: space-around;
            padding: 10px 0 25px 0; backdrop-filter: blur(10px);
            z-index: 1000;
        }

        .nav-item {
            color: var(--text-secondary);
            text-decoration: none; font-size: 11px;
            display: flex; flex-direction: column;
            align-items: center; gap: 4px;
        }
        
        .nav-item.active { color: #fff; }
    </style>
</head>
<body>

    <header>
        <div class="left-side">
            <div class="balance">1.23<span>TON</span></div>
            <div class="profile-btn" onclick="showPage('profile')">👤</div>
        </div>
        <div class="header-btns">
            <div id="ton-connect-button"></div>
        </div>
    </header>

    <div id="market-page" class="page-content active">
        <div class="item-card">
            <div class="item-preview">💎</div>
            <div style="font-weight:600">Aura Crystal</div>
            <div style="color:var(--ton-color); font-weight:800">5 TON</div>
            <button class="btn-main" onclick="buy('Crystal')">Купить</button>
        </div>
        <div class="item-card">
            <div class="item-preview">🎁</div>
            <div style="font-weight:600">Aura Box</div>
            <div style="color:var(--ton-color); font-weight:800">10 TON</div>
            <button class="btn-main" onclick="buy('Box')">Купить</button>
        </div>
    </div>

    <div id="auctions-page" class="page-content">
        <div class="item-card">
            <span class="badge-auction">LIVE</span>
            <div class="item-preview">⚡️</div>
            <div style="font-weight:600">Rare Aura #01</div>
            <div style="color:#ffcc00; font-weight:800">Min: 50 TON</div>
            <button class="btn-main" style="background:#ffcc00" onclick="bid()">Ставка</button>
        </div>
        <div class="item-card">
            <span class="badge-auction">LIVE</span>
            <div class="item-preview">🔥</div>
            <div style="font-weight:600">Legendary User</div>
            <div style="color:#ffcc00; font-weight:800">Min: 150 TON</div>
            <button class="btn-main" style="background:#ffcc00" onclick="bid()">Ставка</button>
        </div>
    </div>

    <div id="profile-page" class="page-content" style="grid-template-columns: 1fr; text-align: center;">
        <h2>Твой профиль</h2>
        <p style="color:#888">Здесь будет список твоих подарков и история покупок.</p>
    </div>

    <nav>
        <a href="javascript:void(0)" class="nav-item active" id="nav-market" onclick="showPage('market')"><span>🏪</span>Market</a>
        <a href="javascript:void(0)" class="nav-item" id="nav-auctions" onclick="showPage('auctions')"><span>🔨</span>Auctions</a>
        <a href="javascript:void(0)" class="nav-item" id="nav-profile" onclick="showPage('profile')"><span>👤</span>Profile</a>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Функция переключения страниц
        function showPage(pageId) {
            // Скрываем все страницы
            document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
            // Деактивируем все пункты меню
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            
            // Показываем нужную
            document.getElementById(pageId + '-page').classList.add('active');
            document.getElementById('nav-' + pageId).classList.add('active');
            
            // Легкая вибрация при переключении
            tg.HapticFeedback.impactOccurred('light');
        }

        function buy(name) { tg.showConfirm("Купить " + name + "?"); }
        function bid() { tg.showAlert("Ваша ставка принята!"); }

        try {
            const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
                manifestUrl: 'https://alexfunnyman.github.io/Aura-Marketplace/tonconnect-manifest.json',
                buttonRootId: 'ton-connect-button'
            });
        } catch (e) {}
    </script>
</body>
</html>
