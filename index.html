<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aura Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #111111;
            --text-main: #ffffff;
            --text-secondary: #888888;
            --ton-color: #0088CC;
            --border: #222222;
            --danger: #ff3b30;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, system-ui, sans-serif;
            margin: 0;
            padding-bottom: 120px;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        .left-side { display: flex; align-items: center; gap: 12px; }

        .balance {
            font-size: 34px; 
            font-weight: 900;
            letter-spacing: -1.5px;
            display: flex;
            align-items: baseline;
        }

        .balance span {
            font-size: 18px; 
            color: var(--text-secondary);
            font-weight: 700;
            margin-left: 6px;
        }

        .profile-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            width: 42px; height: 42px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; cursor: pointer;
        }

        #ton-connect-button { scale: 0.9; transform-origin: right; }

        .filters-container {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .filter-row {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .filter-select, .filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: white;
            padding: 12px;
            border-radius: 14px;
            font-size: 13px;
            outline: none;
            appearance: none;
            flex: 1;
            text-align: center;
        }

        .clear-filters-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--danger);
            width: 46px;
            height: 46px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .clear-filters-btn:active {
            transform: scale(0.9);
            background: rgba(255, 59, 48, 0.1);
        }

        .full-width { width: 100%; }

        .page-content { display: none; padding: 0 15px; animation: fadeIn 0.3s ease; }
        .page-content.active { display: grid; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .grid-2 { grid-template-columns: 1fr 1fr; gap: 12px; }

        .item-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 12px;
            text-align: center;
        }

        .item-preview {
            font-size: 45px; margin-bottom: 12px;
            background: linear-gradient(135deg, #1a1a1a, #0a0a0a);
            aspect-ratio: 1/1;
            display: flex; align-items: center; justify-content: center;
            border-radius: 20px;
            border: 1px solid #222;
        }

        .item-name { font-weight: 600; font-size: 14px; margin-bottom: 4px; height: 34px; display: flex; align-items: center; justify-content: center; }
        .item-price { color: var(--ton-color); font-weight: 800; font-size: 15px; }

        .btn-main {
            margin-top: 12px; width: 100%; padding: 10px;
            border-radius: 12px; border: none;
            background: #fff; color: #000;
            font-weight: 800; font-size: 12px;
        }

        nav {
            position: fixed; bottom: 0; width: 100%;
            background: rgba(10,10,10,0.95);
            border-top: 1px solid var(--border);
            display: flex; justify-content: space-around;
            padding: 10px 0 25px 0; backdrop-filter: blur(15px);
            z-index: 1000;
        }

        .nav-item {
            color: var(--text-secondary);
            text-decoration: none; font-size: 10px;
            display: flex; flex-direction: column;
            align-items: center; gap: 4px; width: 25%;
        }
        
        .nav-item.active { color: #fff; }
        .nav-item span:first-child { font-size: 22px; }
    </style>
</head>
<body>

    <header>
        <div class="left-side">
            <div class="balance">100.23<span>TON</span></div>
            <div class="profile-btn" onclick="showPage('profile')">👤</div>
        </div>
        <div class="header-btns">
            <div id="ton-connect-button"></div>
        </div>
    </header>

    <div id="market-filters" class="filters-container">
        <div class="filter-row">
            <select class="filter-select" id="gift-selector" onchange="filterGifts()">
                <option value="all">Gifts</option>
                </select>
            <select class="filter-select"><option>Model</option></select>
            <div class="clear-filters-btn" onclick="resetFilters()">🗑️</div>
        </div>
        <div class="filter-row">
            <button class="filter-btn">Background</button>
            <button class="filter-btn">Symbol</button>
        </div>
        <select class="filter-select full-width"><option>Sort by: Recently added</option></select>
    </div>

    <div id="market-page" class="page-content active grid-2"></div>
    <div id="auctions-page" class="page-content grid-2"></div>
    <div id="gifts-page" class="page-content"></div>
    <div id="activity-page" class="page-content"></div>
    <div id="profile-page" class="page-content"></div>

    <nav>
        <a href="javascript:void(0)" class="nav-item active" id="nav-market" onclick="showPage('market')"><span>🏪</span>Market</a>
        <a href="javascript:void(0)" class="nav-item" id="nav-auctions" onclick="showPage('auctions')"><span>🔨</span>Auctions</a>
        <a href="javascript:void(0)" class="nav-item" id="nav-gifts" onclick="showPage('gifts')"><span>🎁</span>My Gifts</a>
        <a href="javascript:void(0)" class="nav-item" id="nav-activity" onclick="showPage('activity')"><span>📊</span>Activity</a>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        // New extensive gift names list
        const giftNames = [
            "Heart Locket", "Plush Pepe", "Heroic Helmet", "Mighty Arm", "Ion Gem", 
            "Durov's Cap", "Nail Bracelet", "Perfume Bottle", "Magic Potion", "Mini Oscar", 
            "Astral Shard", "Artisan Brick", "Gem Signet", "Sharp Tongue", "Moon Pendant", 
            "Lunar Snake", "Holiday Drink", "Record Player", "Joyful Bundle", "Restless Jar", 
            "Big Year", "Light Sword", "Jingle Bells", "Eternal Candle", "Skull Flower", 
            "Sakura Flower", "Jelly Bunny", "Cupid Charm", "Hanging Star", "Easter Egg", 
            "Spy Agaric", "Homemade Cake", "Snow Globe", "Xmas Stocking", "B-Day Candle", 
            "Candy Cane", "Lush Bouquet", "Top Hat", "Scared Cat", "Spiced Wine", 
            "Evil Eye", "Ionic Dryer", "Ginger Cookie", "Hex Pot", "Stellar Rocket", 
            "Trapped Heart", "Snake Box", "Loot Bag", "Electric Skull", "Love Candle", 
            "Jack-in-the-Box", "Witch Hat", "Love Potion", "Kissed Frog", "Diamond Ring", 
            "Neko Helmet", "Pet Snake", "Jester Hat", "Flying Broom", "Party Sparkler", 
            "Star Notepad", "Voodoo Doll", "Bonded Ring", "Snow Mittens", "Crystal Ball", 
            "Berry Box", "Tama Gadget", "Valentine Box", "Cookie Heart", "Precious Peach", 
            "Bow Tie", "Signet Ring", "Lol Pop", "Santa Hat", "Hypno Lollipop", 
            "Winter Wreath", "Vintage Cigar", "Bunny Muffin", "Mad Pumpkin", "Eternal Rose", 
            "Jolly Chimp", "Input Key", "Desk Calendar", "Swiss Watch", "Sleigh Bell", 
            "Toy Bear", "Sky Stilettos", "Fresh Socks", "Clover Pin", "Instant Ramen", 
            "Mousse Cake", "Spring Basket", "Faith Amulet", "UFC Strike", "Snoop Dogg", 
            "Swag Bag", "Snoop Cigar", "Low Rider", "Westside Sign", "Khabib’s Papakha"
        ];

        // Generate inventory based on the names (default price and icon for now)
        const inventory = giftNames.map(name => ({
            name: name,
            price: Math.floor(Math.random() * 50) + 5, // Random price for demo
            icon: "🎁" // Placeholder icon
        }));

        // Fill the dropdown filter
        const selector = document.getElementById('gift-selector');
        giftNames.forEach(name => {
            const opt = document.createElement('option');
            opt.value = name;
            opt.textContent = name;
            selector.appendChild(opt);
        });

        function renderMarket(filter = "all") {
            const container = document.getElementById('market-page');
            const filteredItems = filter === "all" ? inventory : inventory.filter(item => item.name === filter);
            container.innerHTML = filteredItems.map(item => `
                <div class="item-card">
                    <div class="item-preview">${item.icon}</div>
                    <div class="item-name">${item.name}</div>
                    <div class="item-price">${item.price} TON</div>
                    <button class="btn-main" onclick="buy('${item.name}')">Buy</button>
                </div>
            `).join('');
        }

        function filterGifts() {
            const selected = document.getElementById('gift-selector').value;
            renderMarket(selected);
            tg.HapticFeedback.selectionChanged();
        }

        function resetFilters() {
            document.getElementById('gift-selector').value = "all";
            renderMarket("all");
            tg.HapticFeedback.notificationOccurred('success');
        }

        function showPage(pageId) {
            document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('market-filters').style.display = (pageId === 'market') ? 'flex' : 'none';
            document.getElementById(pageId + '-page').classList.add('active');
            const navBtn = document.getElementById('nav-' + pageId);
            if(navBtn) navBtn.classList.add('active');
            tg.HapticFeedback.impactOccurred('light');
        }

        function buy(name) { tg.showConfirm("Do you want to buy " + name + "?"); }

        renderMarket();

        try {
            const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
                manifestUrl: 'https://alexfunnyman.github.io/Aura-Marketplace/tonconnect-manifest.json',
                buttonRootId: 'ton-connect-button'
            });
        } catch (e) {}
    </script>
</body>
</html>
