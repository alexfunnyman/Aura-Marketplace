<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aura Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #111111;
            --text-main: #ffffff;
            --text-secondary: #888888;
            --ton-color: #0088CC;
            --border: #222222;
            --danger: #ff3b30;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, system-ui, sans-serif;
            margin: 0;
            padding-bottom: 160px;
            overflow-x: hidden;
        }

        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px; background: rgba(0,0,0,0.8);
            backdrop-filter: blur(20px); position: sticky; top: 0; z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        .left-side { display: flex; align-items: center; gap: 12px; }
        .balance { font-size: 34px; font-weight: 900; letter-spacing: -1.5px; display: flex; align-items: baseline; }
        .balance span { font-size: 18px; color: var(--text-secondary); font-weight: 700; margin-left: 6px; }
        
        .profile-btn {
            background: var(--card-bg); border: 1px solid var(--border);
            width: 42px; height: 42px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 20px;
        }

        .filters-container { padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .filter-row { display: flex; gap: 10px; width: 100%; }
        .filter-select, .filter-btn {
            background: var(--card-bg); border: 1px solid var(--border);
            color: white; padding: 12px; border-radius: 14px;
            font-size: 13px; outline: none; appearance: none; flex: 1; text-align: center;
        }

        .clear-filters-btn {
            background: var(--card-bg); border: 1px solid var(--border); color: var(--danger);
            width: 46px; height: 46px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center; font-size: 18px;
            cursor: pointer;
        }

        .page-content { display: none; padding: 0 15px; animation: fadeIn 0.3s ease; }
        .page-content.active { display: grid; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .grid-2 { grid-template-columns: 1fr 1fr; gap: 12px; }

        .item-card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 24px; padding: 12px; text-align: center; position: relative;
        }

        .item-preview {
            font-size: 45px; margin-bottom: 12px;
            background: linear-gradient(135deg, #1a1a1a, #0a0a0a);
            aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center;
            border-radius: 20px; border: 1px solid #222; position: relative;
        }

        .cart-mini-icon {
            position: absolute; bottom: 8px; right: 8px;
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 32px; height: 32px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; cursor: pointer; z-index: 5; transition: 0.3s;
        }

        .item-name { font-weight: 600; font-size: 14px; margin-bottom: 4px; height: 34px; display: flex; align-items: center; justify-content: center; }
        .item-price { color: var(--ton-color); font-weight: 800; font-size: 15px; }
        .btn-main { margin-top: 12px; width: 100%; padding: 10px; border-radius: 12px; border: none; background: #fff; color: #000; font-weight: 800; font-size: 12px; cursor: pointer; }

        #checkout-bar {
            position: fixed; bottom: 85px; left: 15px; right: 15px;
            background: #1c1c1e; border: 1px solid var(--border);
            border-radius: 16px; padding: 12px 20px;
            display: none; justify-content: space-between; align-items: center;
            z-index: 999; box-shadow: 0 -10px 20px rgba(0,0,0,0.5);
            animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .checkout-total { font-weight: 800; font-size: 18px; color: var(--ton-color); }
        .checkout-count { font-size: 12px; color: var(--text-secondary); display: block; }
        .btn-checkout { background: #fff; color: #000; border: none; padding: 8px 20px; border-radius: 10px; font-weight: 800; cursor: pointer; }

        nav {
            position: fixed; bottom: 0; width: 100%; background: rgba(10,10,10,0.95);
            border-top: 1px solid var(--border); display: flex; justify-content: space-around;
            padding: 10px 0 25px 0; backdrop-filter: blur(15px); z-index: 1000;
        }
        .nav-item { color: var(--text-secondary); text-decoration: none; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 25%; }
        .nav-item.active { color: #fff; }
        .nav-item span:first-child { font-size: 22px; }
    </style>
</head>
<body>

    <header>
        <div class="left-side">
            <div class="balance"><span id="user-balance">100.00</span><span>TON</span></div>
            <div class="profile-btn" onclick="showPage('profile')">👤</div>
        </div>
        <div id="ton-connect-button"></div>
    </header>

    <div id="market-filters" class="filters-container">
        <div class="filter-row">
            <select class="filter-select" id="gift-selector" onchange="filterGifts()"><option value="all">Gifts</option></select>
            <select class="filter-select"><option>Model</option></select>
            <div class="clear-filters-btn" onclick="resetFilters()">🗑️</div>
        </div>
        <div class="filter-row">
            <button class="filter-btn">Background</button>
            <button class="filter-btn">Symbol</button>
        </div>
    </div>

    <div id="market-page" class="page-content active grid-2"></div>
    <div id="auctions-page" class="page-content grid-2"></div>
    <div id="gifts-page" class="page-content grid-2"></div>
    <div id="activity-page" class="page-content"></div>
    <div id="profile-page" class="page-content"></div>

    <div id="checkout-bar">
        <div>
            <span class="checkout-total" id="cart-sum">0.0 TON</span>
            <span class="checkout-count" id="cart-count">0 items selected</span>
        </div>
        <button class="btn-checkout" onclick="payCart()">Buy now</button>
    </div>

    <nav>
        <a href="javascript:void(0)" class="nav-item active" id="nav-market" onclick="showPage('market')"><span>🏪</span>Market</a>
        <a href="javascript:void(0)" class="nav-item" id="nav-auctions" onclick="showPage('auctions')"><span>🔨</span>Auctions</a>
        <a href="javascript:void(0)" class="nav-item" id="nav-gifts" onclick="showPage('gifts')"><span>🎁</span>My Gifts</a>
        <a href="javascript:void(0)" class="nav-item" id="nav-activity" onclick="showPage('activity')"><span>📊</span>Activity</a>
    </nav>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();

        let userBalance = 100.00;
        let cart = [];
        let myGifts = [];
        let purchasedIds = new Set(); // ID купленных товаров

        const giftNames = [
            "Heart Locket", "Plush Pepe", "Heroic Helmet", "Mighty Arm", "Ion Gem", "Durov's Cap", "Nail Bracelet", "Perfume Bottle", "Magic Potion", "Mini Oscar", "Astral Shard", "Artisan Brick", "Gem Signet", "Sharp Tongue", "Moon Pendant", "Lunar Snake", "Holiday Drink", "Record Player", "Joyful Bundle", "Restless Jar", "Big Year", "Light Sword", "Jingle Bells", "Eternal Candle", "Skull Flower", "Sakura Flower", "Jelly Bunny", "Cupid Charm", "Hanging Star", "Easter Egg", "Spy Agaric", "Homemade Cake", "Snow Globe", "Xmas Stocking", "B-Day Candle", "Candy Cane", "Lush Bouquet", "Top Hat", "Scared Cat", "Spiced Wine", "Evil Eye", "Ionic Dryer", "Ginger Cookie", "Hex Pot", "Stellar Rocket", "Trapped Heart", "Snake Box", "Loot Bag", "Electric Skull", "Love Candle", "Jack-in-the-Box", "Witch Hat", "Love Potion", "Kissed Frog", "Diamond Ring", "Neko Helmet", "Pet Snake", "Jester Hat", "Flying Broom", "Party Sparkler", "Star Notepad", "Voodoo Doll", "Bonded Ring", "Snow Mittens", "Crystal Ball", "Berry Box", "Tama Gadget", "Valentine Box", "Cookie Heart", "Precious Peach", "Bow Tie", "Signet Ring", "Lol Pop", "Santa Hat", "Hypno Lollipop", "Winter Wreath", "Vintage Cigar", "Bunny Muffin", "Mad Pumpkin", "Eternal Rose", "Jolly Chimp", "Input Key", "Desk Calendar", "Swiss Watch", "Sleigh Bell", "Toy Bear", "Sky Stilettos", "Fresh Socks", "Clover Pin", "Instant Ramen", "Mousse Cake", "Spring Basket", "Faith Amulet", "UFC Strike", "Snoop Dogg", "Swag Bag", "Snoop Cigar", "Low Rider", "Westside Sign", "Khabib’s Papakha"
        ];

        const inventory = giftNames.map((name, i) => ({
            id: i, name: name, price: (Math.random() * 15 + 1).toFixed(2), icon: "🎁"
        }));

        const selector = document.getElementById('gift-selector');
        giftNames.forEach(name => {
            const opt = document.createElement('option');
            opt.value = name; opt.textContent = name; selector.appendChild(opt);
        });

        function updateBalanceUI() {
            document.getElementById('user-balance').textContent = userBalance.toFixed(2);
        }

        function renderMarket(filter = "all") {
            const container = document.getElementById('market-page');
            // Фильтруем: только те, что НЕ куплены
            const filteredItems = inventory.filter(item => {
                const matchesFilter = (filter === "all" || item.name === filter);
                return matchesFilter && !purchasedIds.has(item.id);
            });
            
            container.innerHTML = filteredItems.map(item => {
                const inCart = cart.some(c => c.id === item.id);
                const cartStyle = inCart ? 'background: var(--ton-color); border-color: white;' : '';
                
                return `
                    <div class="item-card">
                        <div class="item-preview">
                            ${item.icon}
                            <div class="cart-mini-icon" style="${cartStyle}" onclick="event.stopPropagation(); addToCart(${item.id})">🛒</div>
                        </div>
                        <div class="item-name">${item.name}</div>
                        <div class="item-price">${item.price} TON</div>
                        <button class="btn-main" onclick="buyOne(${item.id})">Buy</button>
                    </div>
                `;
            }).join('');
        }

        function addToCart(itemId) {
            if (purchasedIds.has(itemId)) return;
            const item = inventory.find(i => i.id === itemId);
            const exists = cart.some(c => c.id === itemId);
            
            if (exists) {
                tg.showAlert(`"${item.name}" уже в корзине!`);
                return;
            }

            cart.push(item);
            updateCartUI();
            renderMarket(document.getElementById('gift-selector').value);
            tg.HapticFeedback.impactOccurred('medium');
        }

        function updateCartUI() {
            const bar = document.getElementById('checkout-bar');
            if (cart.length > 0) {
                const total = cart.reduce((acc, i) => acc + parseFloat(i.price), 0).toFixed(2);
                document.getElementById('cart-sum').textContent = `${total} TON`;
                document.getElementById('cart-count').textContent = `${cart.length} подарков выбрано`;
                bar.style.display = 'flex';
            } else { 
                bar.style.display = 'none'; 
            }
        }

        function buyOne(itemId) {
            const item = inventory.find(i => i.id === itemId);
            const price = parseFloat(item.price);

            tg.showConfirm(`Купить "${item.name}" за ${price} TON?`, (ok) => {
                if(ok) {
                    if (userBalance >= price) {
                        userBalance -= price;
                        completePurchase([item]);
                        tg.showAlert("Поздравляем с покупкой!");
                    } else {
                        tg.showAlert("Недостаточно баланса!");
                        tg.HapticFeedback.notificationOccurred('error');
                    }
                }
            });
        }

        function payCart() {
            const total = parseFloat(cart.reduce((acc, i) => acc + parseFloat(i.price), 0).toFixed(2));
            tg.showConfirm(`Оплатить корзину на сумму ${total} TON?`, (ok) => {
                if(ok) {
                    if (userBalance >= total) {
                        userBalance -= total;
                        completePurchase([...cart]);
                        cart = [];
                        updateCartUI();
                        tg.showAlert("Все товары куплены!");
                    } else {
                        tg.showAlert("Недостаточно баланса для всей корзины!");
                        tg.HapticFeedback.notificationOccurred('error');
                    }
                }
            });
        }

        function completePurchase(items) {
            items.forEach(item => {
                purchasedIds.add(item.id);
                myGifts.push(item);
                // Удаляем из корзины, если он там был
                cart = cart.filter(c => c.id !== item.id);
            });
            updateBalanceUI();
            updateCartUI();
            renderMarket(document.getElementById('gift-selector').value);
            tg.HapticFeedback.notificationOccurred('success');
        }

        function renderMyGifts() {
            const container = document.getElementById('gifts-page');
            if (myGifts.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align:center; color:#888; margin-top:40px;">У вас пока нет подарков</p>';
                return;
            }
            container.innerHTML = myGifts.map(item => `
                <div class="item-card">
                    <div class="item-preview">${item.icon}</div>
                    <div class="item-name">${item.name}</div>
                    <div style="font-size:10px; color:var(--ton-color); font-weight:bold;">В КОЛЛЕКЦИИ</div>
                </div>
            `).join('');
        }

        function filterGifts() { renderMarket(document.getElementById('gift-selector').value); }
        
        function resetFilters() { 
            document.getElementById('gift-selector').value = "all"; 
            cart = []; 
            updateCartUI();
            renderMarket("all"); 
        }

        function showPage(pageId) {
            document.querySelectorAll('.page-content, .nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById(pageId + '-page').classList.add('active');
            document.getElementById('nav-' + pageId).classList.add('active');
            document.getElementById('market-filters').style.display = (pageId === 'market') ? 'flex' : 'none';
            if(pageId === 'gifts') renderMyGifts();
            tg.HapticFeedback.impactOccurred('light');
        }

        updateBalanceUI();
        renderMarket();
    </script>
</body>
</html>
