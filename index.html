<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aura Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #111111;
            --accent-color: #ffffff;
            --text-main: #ffffff;
            --text-secondary: #888888;
            --ton-color: #0088CC;
            --border: #222222;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, sans-serif;
            margin: 0;
            padding-bottom: 80px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 16px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(15px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #222;
        }

        .balance {
            font-size: 28px;
            font-weight: 850;
            letter-spacing: -1.5px;
            color: #ffffff;
            line-height: 1;
        }

        .balance span {
            font-size: 12px;
            color: #888;
            font-weight: 400;
            margin-left: 2px;
        }

        .header-btns {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        #ton-connect-button {
            transform: scale(0.9);
            transform-origin: right;
        }

        .profile-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        /* Контейнер для кнопки Ton Connect */
        #ton-connect-button {
            display: inline-block;
        }

        .filters-section {
            padding: 15px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        select, .filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            width: 100%;
            text-align: center;
        }

        .full-width { grid-column: span 2; }

        .gift-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 15px;
        }

        .gift-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 12px;
            text-align: center;
        }

        .gift-preview {
            width: 100%; aspect-ratio: 1/1;
            background: linear-gradient(45deg, #111, #222);
            border-radius: 12px; margin-bottom: 10px;
            display: flex; align-items: center; justify-content: center; font-size: 40px;
        }

        nav {
            position: fixed; bottom: 0; width: 100%;
            background: rgba(10, 10, 10, 0.95);
            border-top: 1px solid var(--border);
            display: flex; justify-content: space-around;
            padding: 10px 0 25px 0; backdrop-filter: blur(15px);
        }

        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            color: var(--text-secondary); text-decoration: none; font-size: 10px; gap: 4px;
        }

        .nav-item.active { color: var(--text-main); }
    </style>
</head>
<body>

    <header>
        <div class="balance" id="user-balance">0.00 <span>TON</span></div>
        <div class="header-btns">
            <button class="profile-btn">👤</button>
            <div id="ton-connect-button"></div>
        </div>
    </header>

    <div class="filters-section">
        <select><option>Название подарка</option></select>
        <select><option>Модель</option></select>
        <button class="filter-btn">Каталог фонов</button>
        <button class="filter-btn">Узоры</button>
        <select class="full-width">
            <option>Сортировка: недавно добавленные</option>
            <option>Цена: по убыванию</option>
        </select>
    </div>

    <div class="gift-grid">
        <div class="gift-item">
            <div class="gift-preview">🎁</div>
            <div class="gift-title">Aura Gift</div>
            <div class="price-tag" style="color:var(--ton-color)">5 TON</div>
        </div>
        <div class="gift-item">
            <div class="gift-preview">✨</div>
            <div class="gift-title">Rare Aura</div>
            <div class="price-tag" style="color:var(--ton-color)">15 TON</div>
        </div>
    </div>

    <nav>
        <a href="#" class="nav-item active"><span>🏪</span><span>Market</span></a>
        <a href="#" class="nav-item"><span>🔨</span><span>Auctions</span></a>
        <a href="#" class="nav-item"><span>🎁</span><span>My Gifts</span></a>
        <a href="#" class="nav-item"><span>📊</span><span>Activity</span></a>
    </nav>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.headerColor = '#000000';

        // Инициализация TonConnect UI
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://alexfunnyman.github.io/Aura-Marketplace/tonconnect-manifest.json',
            buttonRootId: 'ton-connect-button'
        });

        // Следим за состоянием кошелька
        tonConnectUI.onStatusChange(wallet => {
            if (wallet) {
                console.log('Кошелек подключен:', wallet.account.address);
                // Здесь в будущем мы запросим баланс через API
            } else {
                console.log('Кошелек отключен');
            }
        });
    </script>
</body>
</html>
