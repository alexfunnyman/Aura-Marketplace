<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aura Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #111111;
            --text-main: #ffffff;
            --text-secondary: #888888;
            --ton-color: #0088CC;
            --border: #222222;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, system-ui, sans-serif;
            margin: 0;
            padding-bottom: 100px;
            overflow-x: hidden;
        }

        /* Шапка с огромным балансом */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(20px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        .balance {
            font-size: 34px; /* Огромные цифры */
            font-weight: 900;
            letter-spacing: -1.5px;
            display: flex;
            align-items: baseline;
        }

        .balance span {
            font-size: 18px; /* Крупная надпись TON */
            color: var(--text-secondary);
            font-weight: 700;
            margin-left: 6px;
        }

        .header-btns {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        #ton-connect-button {
            scale: 0.9;
            transform-origin: right;
        }

        /* Сетка подарков */
        .gift-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 20px 15px;
        }

        .gift-item {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 16px;
            text-align: center;
        }

        .gift-preview {
            font-size: 40px;
            margin-bottom: 10px;
            background: #1a1a1a;
            aspect-ratio: 1/1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
        }

        .buy-btn {
            margin-top: 12px;
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            border: none;
            background: #fff;
            color: #000;
            font-weight: 800;
            font-size: 13px;
        }

        /* Нижнее меню */
        nav {
            position: fixed; bottom: 0; width: 100%;
            background: rgba(10,10,10,0.9);
            border-top: 1px solid var(--border);
            display: flex; justify-content: space-around;
            padding: 10px 0 25px 0; backdrop-filter: blur(10px);
        }

        .nav-item {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        
        .nav-item.active { color: #fff; }
    </style>
</head>
<body>

    <header>
        <div class="balance">1.23<span>AURA</span></div>
        <div class="header-btns">
            <div id="ton-connect-button"></div>
        </div>
    </header>

    <div class="gift-grid">
        <div class="gift-item">
            <div class="gift-preview">💎</div>
            <div style="font-weight:600">Aura Crystal</div>
            <div style="color:var(--ton-color); font-weight:800">5 TON</div>
            <button class="buy-btn" onclick="buy()">Купить</button>
        </div>
        <div class="gift-item">
            <div class="gift-preview">🎁</div>
            <div style="font-weight:600">Aura Box</div>
            <div style="color:var(--ton-color); font-weight:800">10 TON</div>
            <button class="buy-btn" onclick="buy()">Купить</button>
        </div>
    </div>

    <nav>
        <a href="#" class="nav-item active"><span>🏪</span>Market</a>
        <a href="#" class="nav-item"><span>🎁</span>Gifts</a>
        <a href="#" class="nav-item"><span>👤</span>Profile</a>
    </nav>

    <script>
        // Инициализация Telegram
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Безопасная инициализация Ton Connect
        try {
            const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
                manifestUrl: 'https://alexfunnyman.github.io/Aura-Marketplace/tonconnect-manifest.json',
                buttonRootId: 'ton-connect-button'
            });
        } catch (e) {
            console.error("Ошибка TonConnect:", e);
        }

        function buy() {
            tg.showConfirm("Вы уверены, что хотите купить этот подарок?");
        }
    </script>
</body>
</html>
