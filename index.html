<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aura Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #111111;
            --accent-color: #ffffff;
            --text-main: #ffffff;
            --text-secondary: #888888;
            --ton-color: #0088CC;
            --border: #222222;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            padding-bottom: 90px;
            overflow-x: hidden;
        }

        /* Ультра-стильная шапка */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(15px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
        }

        /* Крупный и мощный баланс */
        .balance {
            font-size: 32px; /* Еще больше цифры */
            font-weight: 900;
            letter-spacing: -1.5px;
            color: var(--text-main);
            display: flex;
            align-items: baseline;
            line-height: 1;
        }

        /* Увеличенная надпись TON */
        .balance span {
            font-size: 18px; /* Как ты и просил — теперь крупно */
            color: var(--text-secondary);
            font-weight: 700;
            margin-left: 6px;
            letter-spacing: 0;
        }

        .header-btns {
            display: flex;
            gap: 8px;
            align-items: center;
        }
